# placeholders, real values in /var/secrets/dotfiles/vars.toml (see README.md)
placeholder = true

username = "user"
email = "user@example.com"
domain = "example.com"
repo = "https://codeberg.org/user/dotfiles.git"

# beacon's static address; only beacon asks for them, the other hosts use DHCP
[lan]
address = "192.168.1.10"
gateway = "192.168.1.1"
subnet = "192.168.1.0/24"
