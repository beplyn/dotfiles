# @x@ placeholders are filled in by apps.nix
# users are declared: admin (password in the ntfy Secret, ADMIN_PASSWORD) and beacon, which
# can only publish to @alertTopic@ with its token; subscribe to @alertTopic@ as admin
apiVersion: v1
kind: Namespace
metadata:
  name: ntfy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy
  namespace: ntfy
data:
  server.yml: |
    base-url: "https://@ntfy.host@"
    listen-http: ":8080"
    behind-proxy: true
    cache-file: /var/lib/ntfy/cache.db
    auth-file: /var/lib/ntfy/user.db
    auth-default-access: deny-all
    enable-login: true
    # iOS only gets pushes relayed through ntfy.sh
    upstream-base-url: "https://ntfy.sh"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: ntfy
  labels:
    app: ntfy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:v2.38.0
          args: ["serve"]
          env:
            - name: TZ
              value: "@tz@"
            - name: ADMIN_HASH
              valueFrom:
                secretKeyRef:
                  name: ntfy
                  key: ADMIN_HASH
            - name: ALERT_HASH
              valueFrom:
                secretKeyRef:
                  name: ntfy
                  key: ALERT_HASH
            - name: ALERT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ntfy
                  key: ALERT_TOKEN
            # comma-separated; created or updated on every start
            - name: NTFY_AUTH_USERS
              value: "admin:$(ADMIN_HASH):admin,beacon:$(ALERT_HASH):user"
            - name: NTFY_AUTH_ACCESS
              value: "beacon:@alertTopic@:wo"
            - name: NTFY_AUTH_TOKENS
              value: "beacon:$(ALERT_TOKEN):host alerts"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/ntfy
              readOnly: true
            - name: data
              mountPath: /var/lib/ntfy
          securityContext:
            runAsNonRoot: true
            runAsUser: @uid@
            runAsGroup: @uid@
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: ntfy
        - name: data
          hostPath:
            path: "@state@/ntfy"
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: ntfy
spec:
  type: NodePort
  selector:
    app: ntfy
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: @ntfy.port@
