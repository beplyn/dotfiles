# @x@ placeholders are filled in by apps.nix
# https through Cloudflare, ssh on the LAN only (host port 22, Forgejo's built-in server on 2222
# in the container: rootless can't bind 22; the host sshd is on 2222 and hostPort would shadow it).
# The init container makes @username@ the admin on first start (password in the forgejo
# Secret, ADMIN_PASSWORD). In the browser nginx logs you in through tinyauth and Forgejo takes
# the Remote-User it passes on; no registration.
apiVersion: v1
kind: Namespace
metadata:
  name: forgejo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app: forgejo
spec:
  replicas: 1
  # one sqlite writer, and the ssh hostPort can't be held twice
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      initContainers:
        - name: bootstrap
          image: codeberg.org/forgejo/forgejo:17-rootless
          # the image's entrypoint writes app.ini from the env first
          command: ["/usr/local/bin/docker-entrypoint.sh"]
          args:
            - /bin/sh
            - -ec
            - |
              gitea migrate
              if [ "$(gitea admin user list --admin | wc -l)" -le 1 ]; then
                gitea admin user create --admin --username "$ADMIN_USERNAME" \
                  --email "$ADMIN_EMAIL" --password "$ADMIN_PASSWORD" --must-change-password=false
              fi
          env: &env
            # FORGEJO__section__KEY is written into app.ini on start
            - name: FORGEJO__database__DB_TYPE
              value: "sqlite3"
            - name: FORGEJO__server__DOMAIN
              value: "@forgejo.host@"
            - name: FORGEJO__server__ROOT_URL
              value: "https://@forgejo.host@/"
            - name: FORGEJO__server__HTTP_PORT
              value: "3000"
            # split-horizon DNS points the LAN at this host
            - name: FORGEJO__server__DISABLE_SSH
              value: "false"
            - name: FORGEJO__server__START_SSH_SERVER
              value: "true"
            - name: FORGEJO__server__SSH_DOMAIN
              value: "@forgejo.host@"
            - name: FORGEJO__server__SSH_PORT
              value: "22"
            - name: FORGEJO__server__SSH_LISTEN_PORT
              value: "2222"
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "true"
            # nginx always sets it, from tinyauth; only existing users get in
            - name: FORGEJO__service__ENABLE_REVERSE_PROXY_AUTHENTICATION
              value: "true"
            - name: FORGEJO__service__ENABLE_REVERSE_PROXY_AUTO_REGISTRATION
              value: "false"
            - name: FORGEJO__security__REVERSE_PROXY_AUTHENTICATION_USER
              value: "Remote-User"
            - name: FORGEJO__security__REVERSE_PROXY_AUTHENTICATION_EMAIL
              value: "Remote-Email"
            - name: FORGEJO__security__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: forgejo
                  key: SECRET_KEY
            - name: FORGEJO__security__INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo
                  key: INTERNAL_TOKEN
            - name: TZ
              value: "@tz@"
            - name: ADMIN_USERNAME
              value: "@username@"
            - name: ADMIN_EMAIL
              value: "@email@"
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo
                  key: ADMIN_PASSWORD
          volumeMounts: &mounts
            - name: data
              mountPath: /var/lib/gitea
          securityContext: &security
            runAsNonRoot: true
            runAsUser: @uid@
            runAsGroup: @uid@
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:17-rootless
          env: *env
          ports:
            - name: http
              containerPort: 3000
            - name: ssh
              containerPort: 2222
              hostPort: 22
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
          volumeMounts: *mounts
          securityContext: *security
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          hostPath:
            path: "@state@/forgejo/data"
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo
  namespace: forgejo
spec:
  type: NodePort
  selector:
    app: forgejo
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: @forgejo.port@
