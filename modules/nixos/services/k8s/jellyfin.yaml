# @x@ placeholders are filled in by apps.nix
# QSV/VA-API on the Arc through the intel-gpu device plugin. Music and video are mounted
# read-only: Jellyfin can never rewrite tags or drop artwork into the library, and the
# btrfs mirror under them checksums every block
apiVersion: v1
kind: Namespace
metadata:
  name: jellyfin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        # owns /dev/dri/renderD*
        supplementalGroups: [@render@]
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:12
          env:
            - name: JELLYFIN_PublishedServerUrl
              value: "https://@jellyfin.host@"
            - name: TZ
              value: "@tz@"
          ports:
            - name: http
              containerPort: 8096
          readinessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: config
              mountPath: /config
            # metadata and images: read a lot, written once
            - name: cache
              mountPath: /cache
            # Jellyfin's default transcode dir, the write-heavy part, off the SSDs
            - name: transcodes
              mountPath: /cache/transcodes
            - name: music
              mountPath: /media/music
              readOnly: true
            - name: video
              mountPath: /media/video
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: @uid@
            runAsGroup: @uid@
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 4Gi
              @gpu@: 1
      volumes:
        - name: config
          hostPath:
            path: "@state@/jellyfin"
            type: Directory
        - name: cache
          hostPath:
            path: "@cache@/jellyfin"
            type: Directory
        - name: transcodes
          hostPath:
            path: "@scratch@/jellyfin-transcodes"
            type: Directory
        - name: music
          hostPath:
            path: "@bulk@/music"
            type: Directory
        - name: video
          hostPath:
            path: "@bulk@/video"
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  type: NodePort
  selector:
    app: jellyfin
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: @jellyfin.port@
