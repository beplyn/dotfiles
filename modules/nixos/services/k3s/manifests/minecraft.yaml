# @x@ placeholders are filled in by apps.nix
# vanilla 26.3 on tcp://<beacon>:25565; forward it on the router to play from outside.
# Console: kubectl -n minecraft exec deploy/minecraft -- rcon-cli
apiVersion: v1
kind: Namespace
metadata:
  name: minecraft
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: minecraft
  labels:
    app: minecraft
spec:
  replicas: 1
  # one writer on the world and the hostPort
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # saves the world on SIGTERM
      terminationGracePeriodSeconds: 60
      containers:
        - name: minecraft
          image: itzg/minecraft-server:2026.10.1-java25
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: VANILLA
            - name: VERSION
              value: "26.3"
            - name: MEMORY
              value: 12G
            - name: USE_AIKAR_FLAGS
              value: "true"
            # chunks sent to clients, vanilla's max; clients still cap it at their own setting
            - name: VIEW_DISTANCE
              value: "32"
            # chunks that tick: the CPU cost, so kept well below
            - name: SIMULATION_DISTANCE
              value: "12"
            - name: MOTD
              value: beacon
            - name: TZ
              value: "@tz@"
          ports:
            - name: game
              containerPort: 25565
              hostPort: 25565
              protocol: TCP
          readinessProbe:
            exec:
              command: ["mc-health"]
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            # world, server.properties, whitelist and ops
            - name: data
              mountPath: /data
          # not root, so the entrypoint skips its chown
          securityContext:
            runAsNonRoot: true
            runAsUser: @uid@
            runAsGroup: @uid@
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 500m
              memory: 12Gi
            # heap plus JVM overhead
            limits:
              memory: 14Gi
      volumes:
        - name: data
          hostPath:
            path: "@state@/minecraft"
            type: Directory
