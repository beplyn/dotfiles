# @x@ placeholders are filled in by apps.nix
# metasearch behind tinyauth, so no limiter. Search URL: https://@searxng.host@/search?q=%s
apiVersion: v1
kind: Namespace
metadata:
  name: searxng
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng
  namespace: searxng
data:
  # on top of the defaults; secret_key comes from SEARXNG_SECRET
  settings.yml: |
    use_default_settings: true
    general:
      instance_name: search
    server:
      base_url: "https://@searxng.host@/"
      limiter: false
      public_instance: false
      image_proxy: true
      # so a search is a plain URL: browser history, back, the address bar
      method: GET
    search:
      autocomplete: duckduckgo
      formats:
        - html
    ui:
      query_in_title: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: searxng
  labels:
    app: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: searxng
          image: searxng/searxng:2026.11.14-fd718fe0b
          env:
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng
                  key: SECRET_KEY
            # its default is ::, and the pod network is IPv4 only
            - name: GRANIAN_HOST
              value: "0.0.0.0"
            - name: TZ
              value: "@tz@"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          # not root: the entrypoint only warns that these aren't searxng's
          volumeMounts:
            - name: config
              mountPath: /etc/searxng
              readOnly: true
            - name: cache
              mountPath: /var/cache/searxng
          securityContext:
            runAsNonRoot: true
            runAsUser: @uid@
            runAsGroup: @uid@
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: searxng
        - name: cache
          emptyDir: { }
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: searxng
spec:
  type: NodePort
  selector:
    app: searxng
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: @searxng.port@
