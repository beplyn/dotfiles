# @x@ placeholders are filled in by apps.nix
# tinyauth plus n8n's owner account (first visit). Webhooks and forms skip tinyauth
apiVersion: v1
kind: Namespace
metadata:
  name: n8n
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
  labels:
    app: n8n
spec:
  replicas: 1
  # one writer on the sqlite db
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: n8n
          # stable; 3.x is still a release candidate
          image: n8nio/n8n:2.47.7
          env:
            # uid @uid@ has no passwd entry, so HOME is / and it'd make /.n8n
            - name: N8N_USER_FOLDER
              value: /home/node
            - name: N8N_HOST
              value: "@n8n.host@"
            - name: N8N_PROTOCOL
              value: https
            - name: N8N_PORT
              value: "5678"
            - name: N8N_EDITOR_BASE_URL
              value: "https://@n8n.host@/"
            - name: WEBHOOK_URL
              value: "https://@n8n.host@/"
            # nginx in front: the client's address from X-Forwarded-For
            - name: N8N_PROXY_HOPS
              value: "1"
            # encrypts the credentials in its db; losing it loses them
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n
                  key: ENCRYPTION_KEY
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            - name: N8N_VERSION_NOTIFICATIONS_ENABLED
              value: "false"
            - name: GENERIC_TIMEZONE
              value: "@tz@"
            - name: TZ
              value: "@tz@"
          ports:
            - name: http
              containerPort: 5678
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            # everything it keeps is in ~/.n8n
            - name: data
              mountPath: /home/node/.n8n
            - name: tmp
              mountPath: /tmp
            # the frontend it builds on every start; /home/node isn't uid @uid@'s to write
            - name: cache
              mountPath: /home/node/.cache
          securityContext:
            runAsNonRoot: true
            runAsUser: @uid@
            runAsGroup: @uid@
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 20m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          hostPath:
            path: "@state@/n8n"
            type: Directory
        - name: tmp
          emptyDir: { }
        - name: cache
          emptyDir: { }
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: n8n
spec:
  type: NodePort
  selector:
    app: n8n
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: @n8n.port@
