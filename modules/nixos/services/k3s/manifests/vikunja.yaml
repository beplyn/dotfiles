# @x@ placeholders are filled in by apps.nix
# not behind tinyauth: the phone apps log in themselves. No registration; make @username@ once,
# with ADMIN_PASSWORD from the vikunja Secret:
#   p="$(k3s kubectl -n vikunja get secret vikunja -o jsonpath='{.data.ADMIN_PASSWORD}' | base64 -d)"
#   k3s kubectl -n vikunja exec deploy/vikunja -- /app/vikunja/vikunja user create \
#     -u @username@ -e @email@ -p "$p"
# With vikunja-oidc sealed (oidc/README.md) there's Pocket ID too, matched to it by email
apiVersion: v1
kind: Namespace
metadata:
  name: vikunja
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja
  namespace: vikunja
  labels:
    app: vikunja
spec:
  replicas: 1
  # one writer on the sqlite db
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vikunja
  template:
    metadata:
      labels:
        app: vikunja
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: vikunja
          image: vikunja/vikunja:2.8.0
          env:
            - name: VIKUNJA_SERVICE_PUBLICURL
              value: "https://@vikunja.host@/"
            - name: VIKUNJA_SERVICE_JWTSECRET
              valueFrom:
                secretKeyRef:
                  name: vikunja
                  key: JWT_SECRET
            - name: VIKUNJA_SERVICE_ENABLEREGISTRATION
              value: "false"
            - name: VIKUNJA_SERVICE_TIMEZONE
              value: "@tz@"
            - name: VIKUNJA_DATABASE_TYPE
              value: sqlite
            - name: VIKUNJA_DATABASE_PATH
              value: /db/vikunja.db
            - name: VIKUNJA_FILES_BASEPATH
              value: /files
            - name: VIKUNJA_FILES_MAXSIZE
              value: 20MB
            # Pocket ID next to the password; the button does nothing until the client is sealed
            - name: VIKUNJA_AUTH_LOCAL_ENABLED
              value: "true"
            - name: VIKUNJA_AUTH_OPENID_ENABLED
              value: "true"
            - name: VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_NAME
              value: "Pocket ID"
            - name: VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_AUTHURL
              value: "https://@pocket-id.host@"
            - name: VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_SCOPE
              value: "openid email profile"
            # the existing account with that email, not a second one
            - name: VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_EMAILFALLBACK
              value: "true"
            - name: VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_CLIENTID
              valueFrom:
                secretKeyRef:
                  name: vikunja-oidc
                  key: CLIENT_ID
                  optional: true
            - name: VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: vikunja-oidc
                  key: CLIENT_SECRET
                  optional: true
            - name: TZ
              value: "@tz@"
          ports:
            - name: http
              containerPort: 3456
          readinessProbe:
            httpGet:
              path: /api/v1/info
              port: http
          volumeMounts:
            - name: db
              mountPath: /db
            - name: files
              mountPath: /files
          securityContext:
            runAsNonRoot: true
            runAsUser: @uid@
            runAsGroup: @uid@
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 512Mi
      volumes:
        - name: db
          hostPath:
            path: "@state@/vikunja"
            type: Directory
        - name: files
          hostPath:
            path: "@state@/vikunja/files"
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: vikunja
  namespace: vikunja
spec:
  type: NodePort
  selector:
    app: vikunja
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: @vikunja.port@
