# @x@ placeholders are filled in by apps.nix
# syncs into @bulk@/sync as @username@; GUI behind tinyauth (leave its login unset).
# Devices connect to tcp://<beacon>:22000 or via discovery
apiVersion: v1
kind: Namespace
metadata:
  name: syncthing
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: syncthing
  namespace: syncthing
  labels:
    app: syncthing
spec:
  replicas: 1
  # one writer on its index and the hostPort
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: syncthing
  template:
    metadata:
      labels:
        app: syncthing
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: syncthing
          image: syncthing/syncthing:2.1.7
          env:
            # ~/Sync would be in the image, not on tank
            - name: STNODEFAULTFOLDER
              value: "1"
            - name: TZ
              value: "@tz@"
          ports:
            # on a non-loopback address, so no Host check against sync.@domain@
            - name: http
              containerPort: 8384
            - name: sync
              containerPort: 22000
              hostPort: 22000
              protocol: TCP
            - name: quic
              containerPort: 22000
              hostPort: 22000
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /rest/noauth/health
              port: http
          volumeMounts:
            # STHOMEDIR: config, keys and index
            - name: config
              mountPath: /var/syncthing/config
            # add folders under /sync
            - name: data
              mountPath: /sync
            - name: music
              mountPath: /music
            - name: video
              mountPath: /video
          # not root, so the entrypoint runs it as is
          securityContext:
            runAsNonRoot: true
            runAsUser: @useruid@
            runAsGroup: @usergid@
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          hostPath:
            path: "@state@/syncthing"
            type: Directory
        - name: data
          hostPath:
            path: "@bulk@/sync"
            type: Directory
        - name: music
          hostPath:
            path: "@bulk@/music"
            type: Directory
        - name: video
          hostPath:
            path: "@bulk@/video"
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: syncthing
  namespace: syncthing
spec:
  type: NodePort
  selector:
    app: syncthing
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: @syncthing.port@
