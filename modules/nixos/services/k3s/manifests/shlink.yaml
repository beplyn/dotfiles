# @x@ placeholders are filled in by apps.nix
# shlink redirects go.<domain>/slug, public; the API key makes links, from the shortener app
apiVersion: v1
kind: Namespace
metadata:
  name: shlink
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shlink
  namespace: shlink
  labels:
    app: shlink
spec:
  replicas: 1
  # one writer on the sqlite db
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shlink
  template:
    metadata:
      labels:
        app: shlink
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: shlink
          image: shlinkio/shlink:5.1.9
          env:
            - name: DEFAULT_DOMAIN
              value: "@shlink.host@"
            - name: IS_HTTPS_ENABLED
              value: "true"
            # no GeoLite key: visits still count, just without a country
            - name: SKIP_INITIAL_GEOLITE_DOWNLOAD
              value: "true"
            - name: INITIAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shlink
                  key: API_KEY
            - name: TZ
              value: "@tz@"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            # sqlite at data/database.sqlite under the app root
            - name: data
              mountPath: /etc/shlink/data
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          hostPath:
            path: "@state@/shlink"
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: shlink
  namespace: shlink
spec:
  type: NodePort
  selector:
    app: shlink
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: @shlink.port@
