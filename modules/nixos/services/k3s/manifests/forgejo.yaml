# @x@ placeholders are filled in by apps.nix
# own login, no registration; @username@ is admin (ADMIN_PASSWORD in the Secret).
# ssh on LAN port 22 (2222 inside, rootless can't bind 22).
# Pocket ID login once forgejo-oidc is sealed (docs/pocket-id.md)
apiVersion: v1
kind: Namespace
metadata:
  name: forgejo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app: forgejo
spec:
  replicas: 1
  # one sqlite writer, and the ssh hostPort can't be held twice
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      initContainers:
        # uid 3000 has no passwd entry in the image; ssh (push mirrors) aborts on
        # "No user exists for uid". Copy the image's passwd and add one for it.
        - name: passwd
          image: codeberg.org/forgejo/forgejo:17-rootless
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cp /etc/passwd /out/passwd
              if ! awk -F: '$3 == 3000 { found = 1 } END { exit !found }' /out/passwd; then
                printf '\nforgejo:x:3000:3000::/var/lib/gitea:/bin/sh\n' >> /out/passwd
              fi
          securityContext:
            runAsNonRoot: true
            runAsUser: @uid@
            runAsGroup: @uid@
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: passwd
              mountPath: /out
        - name: bootstrap
          image: codeberg.org/forgejo/forgejo:17-rootless
          # the image's entrypoint writes app.ini from the env first
          command: ["/usr/local/bin/docker-entrypoint.sh"]
          args:
            - /bin/sh
            - -ec
            - |
              gitea migrate
              if [ "$(gitea admin user list --admin | wc -l)" -le 1 ]; then
                gitea admin user create --admin --username "$ADMIN_USERNAME" \
                  --email "$ADMIN_EMAIL" --password "$ADMIN_PASSWORD" --must-change-password=false
              fi
              # Pocket ID as a second login, once its client is sealed; kept in step with it
              if [ -n "${OIDC_CLIENT_ID:-}" ]; then
                set -- --name pocket-id --provider openidConnect \
                  --key "$OIDC_CLIENT_ID" --secret "$OIDC_CLIENT_SECRET" \
                  --auto-discover-url "https://$OIDC_HOST/.well-known/openid-configuration" \
                  --scopes "openid email profile groups" \
                  --group-claim-name groups --admin-group wheel \
                  --skip-local-2fa
                id="$(gitea admin auth list | awk '$2 == "pocket-id" { print $1 }')"
                if [ -n "$id" ]; then
                  gitea admin auth update-oauth --id "$id" "$@"
                else
                  gitea admin auth add-oauth "$@"
                fi
              fi
          env: &env
            # FORGEJO__section__KEY is written into app.ini on start
            - name: FORGEJO__database__DB_TYPE
              value: "sqlite3"
            - name: FORGEJO__server__DOMAIN
              value: "@forgejo.host@"
            - name: FORGEJO__server__ROOT_URL
              value: "https://@forgejo.host@/"
            - name: FORGEJO__server__HTTP_PORT
              value: "3000"
            # split-horizon DNS points the LAN at this host
            - name: FORGEJO__server__DISABLE_SSH
              value: "false"
            - name: FORGEJO__server__START_SSH_SERVER
              value: "true"
            - name: FORGEJO__server__SSH_DOMAIN
              value: "@forgejo.host@"
            - name: FORGEJO__server__SSH_PORT
              value: "22"
            - name: FORGEJO__server__SSH_LISTEN_PORT
              value: "2222"
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "true"
            # browser logins go through Pocket ID only; SSH and API tokens are unaffected
            - name: FORGEJO__service__ENABLE_PASSWORD_SIGNIN_FORM
              value: "false"
            - name: FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION
              value: "true"
            # Pocket ID already requires its own 2FA, so no local 2FA prompt after it
            - name: FORGEJO__oauth2_client__SKIP_LOCAL_2FA
              value: "true"
            # link Pocket ID logins to an existing account with the same email
            - name: FORGEJO__oauth2_client__ACCOUNT_LINKING
              value: "auto"
            # from seal-oidc; absent until then
            - name: OIDC_HOST
              value: "@pocket-id.host@"
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: forgejo-oidc
                  key: CLIENT_ID
                  optional: true
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-oidc
                  key: CLIENT_SECRET
                  optional: true
            - name: FORGEJO__security__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: forgejo
                  key: SECRET_KEY
            - name: FORGEJO__security__INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo
                  key: INTERNAL_TOKEN
            - name: TZ
              value: "@tz@"
            - name: ADMIN_USERNAME
              value: "@username@"
            - name: ADMIN_EMAIL
              value: "@email@"
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo
                  key: ADMIN_PASSWORD
          volumeMounts: &mounts
            - name: data
              mountPath: /var/lib/gitea
            - name: passwd
              mountPath: /etc/passwd
              subPath: passwd
          securityContext: &security
            runAsNonRoot: true
            runAsUser: @uid@
            runAsGroup: @uid@
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:17-rootless
          env: *env
          ports:
            - name: http
              containerPort: 3000
            - name: ssh
              containerPort: 2222
              hostPort: 22
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
          volumeMounts: *mounts
          securityContext: *security
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          hostPath:
            path: "@state@/forgejo/data"
            type: Directory
        - name: passwd
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo
  namespace: forgejo
spec:
  type: NodePort
  selector:
    app: forgejo
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: @forgejo.port@
