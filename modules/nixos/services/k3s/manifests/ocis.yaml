# ownCloud Infinite Scale: native OIDC against Pocket ID, TLS ends at nginx (docs/drive.md)
apiVersion: v1
kind: Namespace
metadata:
  name: ocis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocis
  namespace: ocis
  labels:
    app: ocis
spec:
  replicas: 1
  # one writer on the data dir
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ocis
  template:
    metadata:
      labels:
        app: ocis
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: ocis
          image: owncloud/ocis:8.2
          args: ["server"]
          env:
            - name: OCIS_URL
              value: "https://@ocis.host@"
            - name: OCIS_INSECURE
              value: "false"
            - name: PROXY_TLS
              value: "false"
            - name: OCIS_OIDC_ISSUER
              value: "https://@pocket-id.host@"
            - name: PROXY_OIDC_ISSUER
              value: "https://@pocket-id.host@"
            # desktop and mobile apps discover the provider through oCIS
            - name: PROXY_OIDC_REWRITE_WELLKNOWN
              value: "true"
            # the web client's ID; the sealed ocis-oidc secret fills it in
            - name: WEB_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ocis-oidc
                  key: CLIENT_ID
                  optional: true
            # request the groups claim so the wheel -> admin mapping can match
            - name: WEB_OIDC_SCOPE
              value: "openid profile email groups"
            # create the account on a user's first Pocket ID login
            - name: PROXY_AUTOPROVISION_ACCOUNTS
              value: "true"
            # autoprovisioning needs a writable user backend
            - name: GRAPH_LDAP_SERVER_WRITE_ENABLED
              value: "true"
            - name: OCIS_BASE_DATA_PATH
              value: /var/lib/ocis
            - name: OCIS_CONFIG_DIR
              value: /var/lib/ocis/config
            - name: PROXY_CSP_CONFIG_FILE_LOCATION
              value: /var/lib/ocis/config/csp.yaml
            # temporary: show claims during role debugging
            - name: OCIS_LOG_LEVEL
              value: debug
            - name: OCIS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ocis
                  key: OCIS_JWT_SECRET
            - name: OCIS_TRANSFER_SECRET
              valueFrom:
                secretKeyRef:
                  name: ocis
                  key: OCIS_TRANSFER_SECRET
            - name: OCIS_MACHINE_AUTH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ocis
                  key: OCIS_MACHINE_AUTH_API_KEY
            - name: OCIS_SERVICE_ACCOUNT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ocis
                  key: OCIS_SERVICE_ACCOUNT_SECRET
            - name: TZ
              value: "@tz@"
          ports:
            - name: http
              containerPort: 9200
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/ocis
            # group wheel -> admin role
            - name: proxy-config
              mountPath: /var/lib/ocis/config/proxy.yaml
              subPath: proxy.yaml
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: @uid@
            runAsGroup: @uid@
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: data
          hostPath:
            path: "@state@/ocis"
            type: Directory
        - name: proxy-config
          configMap:
            name: ocis-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: ocis
  namespace: ocis
spec:
  type: NodePort
  selector:
    app: ocis
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: @ocis.port@
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ocis-proxy-config
  namespace: ocis
data:
  proxy.yaml: |
    proxy:
      role_assignment:
        driver: oidc
        oidc_role_mapper:
          role_claim: groups
          role_mapping:
            # "wheel" is admin; "ocis" is a normal user (no catch-all: it matches the first group)
            - role_name: admin
              claim_value: wheel
            - role_name: user
              claim_value: ocis
