# @x@ placeholders are filled in by apps.nix
# own login as @username@ (ADMIN_PASSWORD in the Secret); extensions use an API token
# (Settings > Integrations). No Pocket ID: it would make a second account
apiVersion: v1
kind: Namespace
metadata:
  name: linkding
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
  namespace: linkding
  labels:
    app: linkding
spec:
  replicas: 1
  # one writer on the sqlite db
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: linkding
          image: sissbruecker/linkding:1.47.0
          env:
            - name: LD_SUPERUSER_NAME
              value: "@username@"
            - name: LD_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: linkding
                  key: ADMIN_PASSWORD
            - name: LD_CSRF_TRUSTED_ORIGINS
              value: "https://@linkding.host@"
            # Pocket ID login next to the local one
            - name: LD_ENABLE_OIDC
              value: "True"
            - name: OIDC_RP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: linkding-oidc
                  key: CLIENT_ID
                  optional: true
            - name: OIDC_RP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: linkding-oidc
                  key: CLIENT_SECRET
                  optional: true
            - name: OIDC_OP_AUTHORIZATION_ENDPOINT
              value: "https://@pocket-id.host@/authorize"
            - name: OIDC_OP_TOKEN_ENDPOINT
              value: "https://@pocket-id.host@/api/oidc/token"
            - name: OIDC_OP_USER_ENDPOINT
              value: "https://@pocket-id.host@/api/oidc/userinfo"
            - name: OIDC_OP_JWKS_ENDPOINT
              value: "https://@pocket-id.host@/.well-known/jwks.json"
            - name: OIDC_RP_SIGN_ALGO
              value: "RS256"
            # new accounts take their name from preferred_username (email if missing)
            - name: OIDC_USERNAME_CLAIM
              value: "preferred_username"
            - name: TZ
              value: "@tz@"
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: data
              mountPath: /etc/linkding/data
          # starts as root, then drops to www-data
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          hostPath:
            path: "@state@/linkding"
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: linkding
  namespace: linkding
spec:
  type: NodePort
  selector:
    app: linkding
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: @linkding.port@
