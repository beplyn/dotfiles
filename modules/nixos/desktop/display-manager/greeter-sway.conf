# ReGreet's compositor; @name@ comes from default.nix
# only the primary output: cage stretched the greeter over every monitor
@outputs@

input type:keyboard xkb_layout "@layout@"

default_border none
xwayland disable

# GTK's default Vulkan renderer froze the greeter mid-password on anvil
exec "env GSK_RENDERER=gl @regreet@; @sway@/bin/swaymsg exit"
