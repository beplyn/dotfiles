# Runs at every boot: one entry per partition holding the removable-media
# loader (/EFI/BOOT/BOOTX64.EFI), so USB sticks and other drives show up
# even if they were not attached during nixos-rebuild.
insmod regexp
insmod chain

for dev in (*); do
  if [ "$dev" = "($root)" ]; then continue; fi
  if [ ! -f "$dev/efi/boot/bootx64.efi" ]; then continue; fi

  regexp --set=1:part '^\((.*)\)$' "$dev"
  unset label
  probe --set=label --label "$part"
  if [ -n "$label" ]; then title="$label ($part)"; else title="EFI on $part"; fi

  # $1 is the title, $2 the first extra argument
  menuentry "$title" --class efi "$dev" {
    chainloader "$2/efi/boot/bootx64.efi"
  }
done
