name: Check hosts

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    name: eval ${{ matrix.host }}
    runs-on: codeberg-medium
    container:
      image: nixos/nix:latest
    strategy:
      fail-fast: false
      matrix:
        host: [anvil, beacon, compass, shulker]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Evaluate ${{ matrix.host }}
        run: |
          set -euo pipefail
          nix --extra-experimental-features "nix-command flakes" eval --raw \
            ".#nixosConfigurations.${{ matrix.host }}-catppuccin.config.system.build.toplevel.drvPath"
          echo
