name: Check hosts

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    name: eval ${{ matrix.host }}
    runs-on: codeberg-medium
    strategy:
      fail-fast: false
      matrix:
        host: [anvil, beacon, compass, shulker]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        run: |
          curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix | sh -s -- install linux \
            --init none \
            --no-confirm

          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"

      - name: Evaluate ${{ matrix.host }}
        shell: bash
        run: |
          set -euo pipefail

          # Ensure Nix binary is in PATH
          export PATH="/nix/var/nix/profiles/default/bin:$PATH"

          nix eval --raw \
            ".#nixosConfigurations.${{ matrix.host }}-catppuccin.config.system.build.toplevel.drvPath"
          echo
